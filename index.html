<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Age Calculator</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body class="body-style">
        <h1 class="heading">Age Calculator</h1>
        <h2 class="sub-heading">Enter your Birthday to calculate your Age </h2>
        
        <div class="calculator">
            <form id="age-form" class="age-form">
                <div class="birthday-row">
                    <label for="birthday" class="label">Enter your Birthday: </label>
                    <input type="text" id="birthday" class="input-field">
                </div>
            
                <button id="calculateBtn" class="calculate-button" type="submit">Calculate</button>
                <p id="result" class="result"></p>
            </form>
            
        </div>
    </body>
    <script src="script.js" type="module"></script>
</html>
